<body><main><h1>NAS Drive Backup</h1><p>用于将个人 NAS 中选定的文件备份到本人 Google Drive 的自用工具。</p><h2>功能</h2><ul><li>按指定时间和带宽分批上传照片、视频及其他文件。</li><li>保留文件夹结构，复制新增和修改的文件。</li><li>源文件删除后保留云端副本，覆盖时保存旧版本。</li></ul><h2>Google 账号授权</h2><p>工具使用 Google OAuth 的 <code>drive.file</code> 权限，读取、创建和更新经用户授权使用的文件。备份程序由用户在自己的 NAS 上运行。此网站只提供应用说明。</p><h2>联系</h2><p>应用维护联系邮箱以 Google 授权页面中的用户支持邮箱为准。</p><nav><a href="privacy.html">隐私政策</a><a href="terms.html">使用条款</a></nav></main></body></html>
